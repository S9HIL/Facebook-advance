<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB@SAHIL_PRAJAPATI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <p class="loader-text">Loading...</p>
        </div>
    </div>

    <!-- Animated Background -->
    <div class="animated-background">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="/">
                <i class="fab fa-facebook-messenger me-2"></i>FB@SAHIL_PRAJAPATI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/"><i class="fas fa-home me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/validate_token"><i class="fas fa-check-circle me-1"></i>Validate Token</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/check_uid"><i class="fas fa-search me-1"></i>Check UID</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/monitor"><i class="fas fa-monitor-waveform me-1"></i>Monitor</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="glass-card animate-fadeIn">
                        <div class="card-header text-center">
                            <h1 class="display-5 fw-bold text-white mb-0">
                                <i class="fas fa-paper-plane me-3"></i>Facebook Message Sender
                            </h1>
                            <p class="text-light mt-3 mb-0">Premium automation tool for Facebook messaging</p>
                            <div class="mt-3">
                                <span class="badge bg-success me-2"><i class="fas fa-shield-alt me-1"></i>Secure</span>
                                <span class="badge bg-primary me-2"><i class="fas fa-rocket me-1"></i>Fast</span>
                                <span class="badge bg-info"><i class="fas fa-lock me-1"></i>Encrypted</span>
                            </div>
                        </div>

                        <form id="messageForm" class="p-4">
                            <!-- Access Token Section -->
                            <div class="form-section mb-4">
                                <h4 class="section-title"><i class="fas fa-key me-2"></i>Access Token</h4>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="token_method" id="token_manual" value="manual" checked>
                                    <label class="form-check-label text-white" for="token_manual">Manual Entry</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="token_method" id="token_file" value="file">
                                    <label class="form-check-label text-white" for="token_file">Upload File</label>
                                </div>
                                
                                <div id="token_manual_input" class="mt-3">
                                    <textarea class="form-control glass-input" name="token_manual" rows="3" placeholder="Enter access tokens (one per line)"></textarea>
                                </div>
                                <div id="token_file_input" class="mt-3" style="display: none;">
                                    <input type="file" class="form-control glass-input" name="token_file" accept=".txt">
                                </div>
                            </div>

                            <!-- Target & Settings -->
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="form-section">
                                        <label class="form-label text-white"><i class="fas fa-user me-2"></i>Target UID</label>
                                        <input type="text" class="form-control glass-input" name="uid" placeholder="Facebook User ID" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-section">
                                        <label class="form-label text-white"><i class="fas fa-clock me-2"></i>Delay Time (seconds)</label>
                                        <input type="number" class="form-control glass-input" name="delay" value="1" min="0.1" step="0.1" required>
                                    </div>
                                </div>
                            </div>

                            <!-- Prompt -->
                            <div class="form-section mb-4">
                                <label class="form-label text-white"><i class="fas fa-tag me-2"></i>Message Prompt (Optional)</label>
                                <input type="text" class="form-control glass-input" name="prompt" placeholder="Text to add before each message">
                            </div>

                            <!-- Message Section -->
                            <div class="form-section mb-4">
                                <h4 class="section-title"><i class="fas fa-message me-2"></i>Message Content</h4>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="message_method" id="message_manual" value="manual" checked>
                                    <label class="form-check-label text-white" for="message_manual">Manual Entry</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="message_method" id="message_file" value="file">
                                    <label class="form-check-label text-white" for="message_file">Upload File</label>
                                </div>
                                
                                <div id="message_manual_input" class="mt-3">
                                    <textarea class="form-control glass-input" name="message_manual" rows="4" placeholder="Enter your message"></textarea>
                                </div>
                                <div id="message_file_input" class="mt-3" style="display: none;">
                                    <input type="file" class="form-control glass-input" name="message_file" accept=".txt">
                                </div>
                            </div>

                            <!-- Mode Selection -->
                            <div class="form-section mb-4">
                                <h4 class="section-title"><i class="fas fa-shield-alt me-2"></i>Sending Mode</h4>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="mode" id="normal_mode" value="normal" checked>
                                    <label class="form-check-label text-white" for="normal_mode">Normal Mode</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="mode" id="e2ee_mode" value="e2ee">
                                    <label class="form-check-label text-white" for="e2ee_mode">End-to-End Encryption</label>
                                </div>
                                
                                <div id="encryption_key_input" class="mt-3" style="display: none;">
                                    <label class="form-label text-white"><i class="fas fa-lock me-2"></i>Encryption Key</label>
                                    <input type="text" class="form-control glass-input" name="encryption_key" placeholder="Enter encryption key">
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="flex-grow-1 text-center">
                                    <button type="submit" class="btn btn-primary btn-lg glass-btn animated-border">
                                        <i class="fas fa-paper-plane me-2"></i>Send Messages
                                    </button>
                                </div>
                                <div>
                                    <button type="reset" class="btn btn-secondary btn-lg glass-btn animated-border">
                                        <i class="fas fa-redo me-2"></i>Reset Form
                                    </button>
                                </div>
                            </div>
                        </form>

                        <!-- Status Display -->
                        <div id="statusDisplay" class="mt-4" style="display: none;">
                            <div class="alert glass-alert">
                                <div id="statusMessage"></div>
                                <div id="batchControls" class="mt-3" style="display: none;">
                                    <button class="btn btn-warning glass-btn me-2" id="stopBatch">
                                        <i class="fas fa-stop me-1"></i>Stop Sending
                                    </button>
                                    <button class="btn btn-info glass-btn" id="viewLogs">
                                        <i class="fas fa-chart-line me-1"></i>View Logs
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer with Branding -->
    <footer class="glass-footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <p class="mb-0 text-white">
                        <i class="fas fa-code me-2"></i>Developed by <strong class="animated-name">SAHIL PRAJAPATI</strong>
                    </p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="mb-0 text-light">
                        <i class="fas fa-shield-alt me-2"></i>Premium Facebook Automation Tool
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
